[package]
name = "rix-eval"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A pure Rust Nix expression evaluator"
repository = "https://github.com/tinted-software/rix"
keywords = ["nix", "evaluator", "parser", "expression"]
categories = ["parsing", "development-tools"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
rix-parser = { path = "../rix-parser" }
rowan = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
md5 = "0.8"
sha1 = "0.11"
hex = "0.4"
base32 = "0.5"
codespan = "0.13"
codespan-reporting = "0.13"
regex = "1.12"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"

[lib]
name = "nix_eval"
path = "src/lib.rs"

[[bench]]
name = "evaluation"
harness = false
