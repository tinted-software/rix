[package]
name = "rix-eval"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A pure Rust Nix expression evaluator"
repository = "https://github.com/tinted-software/rix"
keywords = ["nix", "evaluator", "parser", "expression"]
categories = ["parsing", "development-tools"]

[dependencies]
clap.workspace = true
thiserror.workspace = true
rowan.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
md5.workspace = true
sha1.workspace = true
hex.workspace = true
base32.workspace = true
codespan.workspace = true
codespan-reporting.workspace = true
regex.workspace = true
quick-xml.workspace = true
rix-parser.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
proptest.workspace = true

[lib]
name = "nix_eval"
path = "src/lib.rs"

[[bench]]
name = "evaluation"
harness = false
