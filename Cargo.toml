[workspace]
resolver = "3"
members = ["rix-eval", "rix-parser", "rix-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Sunrise-OS/rix"

[workspace.dependencies]
rix-parser = { path = "rix-parser" }
rix-eval = { path = "rix-eval" }

clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
rootcause = "0.13.0"
rowan = "0.17.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
md5 = "0.8.1"
sha1 = "0.11.0"
hex = "0.4.3"
base32 = "0.5.1"
codespan = "0.13.1"
codespan-reporting = "0.13.1"
regex = "1.13.1"
criterion = "0.8.2"
expect-test = "1.5.1"
proptest = "1.11.0"
quick-xml = "0.42.0"
toml = "1.1.4"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 2
split-debuginfo = "packed"
